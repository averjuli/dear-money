# Dear Money, port 80: Let's Encrypt checks and redirect to https.
# Installed by deploy/setup-nginx-tls.sh. No default_server here: the server
# already has one that drops requests for unknown hosts.

server {
    listen 80;
    server_name dearmoney.space app.dearmoney.space;

    # Let's Encrypt domain checks (also needed for renewals)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}
