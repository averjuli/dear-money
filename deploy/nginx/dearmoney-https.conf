# Dear Money, port 443: one certificate for both names.
# Installed by deploy/setup-nginx-tls.sh after the certificate is issued and
# refreshed by deploy/install-on-server.sh.

server {
    listen 443 ssl http2;
    server_name dearmoney.space;

    ssl_certificate     /etc/letsencrypt/live/dearmoney.space/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dearmoney.space/privkey.pem;
    include snippets/tls.conf;

    # Stub until the landing is deployed
    root /var/www/dearmoney.space;
    location / {
        try_files $uri $uri/ =404;
    }
}

server {
    listen 443 ssl http2;
    server_name app.dearmoney.space;

    ssl_certificate     /etc/letsencrypt/live/dearmoney.space/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dearmoney.space/privkey.pem;
    include snippets/tls.conf;

    # The app in Docker (/opt/dear-money, deploy/compose.yaml), listening only on 127.0.0.1
    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
    }

    # While the app is not running: a page of our own instead of nginx's "502 Bad Gateway".
    # Every deploy refreshes the file together with the rest of deploy/
    error_page 502 503 504 /_unavailable.html;
    location = /_unavailable.html {
        internal;
        alias /opt/dear-money/deploy/unavailable.html;
    }
}
