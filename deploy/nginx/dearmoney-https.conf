# Dear Money, port 443: one certificate for both names.
# Installed by deploy/setup-nginx-tls.sh after the certificate is issued.

server {
    listen 443 ssl http2;
    server_name dearmoney.space;

    ssl_certificate     /etc/letsencrypt/live/dearmoney.space/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dearmoney.space/privkey.pem;
    include snippets/tls.conf;

    # Stub until the landing is deployed
    root /var/www/dearmoney.space;
    location / {
        try_files $uri $uri/ =404;
    }
}

server {
    listen 443 ssl http2;
    server_name app.dearmoney.space;

    ssl_certificate     /etc/letsencrypt/live/dearmoney.space/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dearmoney.space/privkey.pem;
    include snippets/tls.conf;

    # Stub until the app is deployed. Then this becomes a proxy to the app
    # container, which listens only on 127.0.0.1.
    root /var/www/app.dearmoney.space;
    location / {
        try_files $uri $uri/ =404;
    }
}
